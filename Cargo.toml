[package]
name = "tape_digizer"
version = "1.5.1"
edition = "2021"
description = "Professional audio digitization tool for reel-to-reel tapes, cassettes, and vinyl records with Zoom LiveTrak L-12 support"
license = "MIT"
repository = "https://github.com/andreaslangsays/tapedigizer"

[dependencies]
eframe = "0.29"
egui = "0.29"
cpal = "0.15"
hound = "3.5"
rfd = "0.15"
crossbeam-channel = "0.5"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"


[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSEvent", "NSMenu", "NSMenuItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSObject", "NSString"] }
